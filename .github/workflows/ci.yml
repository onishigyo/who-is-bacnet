name: CI

on:
  pull_request:
  push:
    branches: [main]

# 同じブランチへ続けて push したら、古い実行は止める
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint / 整形 / 型チェック / テスト
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: 整形チェック
        run: pnpm format:check

      - name: 型チェック + ビルド
        run: pnpm build

      - name: テスト
        run: pnpm test
